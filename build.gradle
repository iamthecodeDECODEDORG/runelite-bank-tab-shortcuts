plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content {
            includeGroupByRegex('net\\.runelite.*')
        }
    }
    mavenCentral()
}

def runeLiteVersion = '1.13.1'
def pluginMainClass = 'io.github.iamthecodedecoded.banktabshortcuts.BankTabShortcutsPluginTestClient'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
}

group = 'io.github.iamthecodedecoded'
version = '1.1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(Test).configureEach {
    // Test logging must never write into the user's live RuneLite directory.
    systemProperty 'user.home', layout.buildDirectory.dir("test-home/${name}").get().asFile.absolutePath
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = pluginMainClass
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

// Exercise the shipped production classes, not build/classes/java/main.
tasks.register('packagedTest', Test) {
    dependsOn jar, testClasses
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(tasks.jar.archiveFile) + sourceSets.test.output + configurations.testRuntimeClasspath
    systemProperty 'bankTabShortcuts.packagedTest', 'true'
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Build-only payload for a leased, network-disabled Windows visual worker.
tasks.register('stageVisualPreview', Copy) {
    dependsOn jar, testClasses
    into layout.buildDirectory.dir('visual-payload')
    from(tasks.jar.archiveFile) { into 'lib' }
    from(configurations.testRuntimeClasspath) { into 'lib' }
    from(sourceSets.test.output) { into 'test-classes' }
}
